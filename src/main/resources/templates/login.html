<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="auth-container">
        <div class="card-custom">
            <a href="index.html" th:href="@{/}" class="text-decoration-none"><h1 class="brand-logo"><i class="fa-solid fa-droplet"></i>CleanTrack</h1></a>
            <p class="auth-subtitle">Welcome back! Please enter your details.</p>

            <div th:if="${error}" class="alert-custom alert-custom-danger">
                <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}">Error details</span>
            </div>

            <div th:if="${param.registered}" class="alert-custom alert-custom-success">
                <i class="fa-solid fa-circle-check me-2"></i>Registration successful! Please log in.
            </div>

            <div th:if="${param.logout}" class="alert-custom alert-custom-success">
                <i class="fa-solid fa-right-from-bracket me-2"></i>You have been logged out.
            </div>

            <form th:action="@{/login}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group-custom">
                        <input type="text" name="username" class="form-control-custom" placeholder="Enter your username" autocomplete="username" required autofocus>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group-custom">
                        <input type="password" name="password" class="form-control-custom" placeholder="Enter your password" autocomplete="current-password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom mb-4">Sign In</button>
            </form>

            <p class="auth-footer mb-0">Don't have an account? <a href="register.html" th:href="@{/register}" class="redirect-link">Sign up</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
