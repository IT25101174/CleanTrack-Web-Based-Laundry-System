<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - Secure Login</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Font: Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-glow: #3b82f6;
            --secondary-glow: #8b5cf6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Abstract glowing blobs for premium feel */
        .glow-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }
        
        .blob-1 {
            width: 350px;
            height: 350px;
            background: var(--primary-glow);
            top: 10%;
            left: 15%;
            animation: float-slow 12s infinite alternate;
        }

        .blob-2 {
            width: 400px;
            height: 400px;
            background: var(--secondary-glow);
            bottom: 10%;
            right: 15%;
            animation: float-slow 15s infinite alternate-reverse;
        }

        @keyframes float-slow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -20px) scale(1.1); }
            100% { transform: translate(-20px, 40px) scale(0.95); }
        }

        .login-container {
            z-index: 10;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 25px 50px rgba(59, 130, 246, 0.1);
        }

        .brand-logo {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 24px;
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            transition: color 0.3s ease;
            z-index: 10;
        }

        .form-control-custom {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control-custom:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--primary-glow);
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.25);
        }

        .form-control-custom:focus + i {
            color: var(--primary-glow);
        }

        .btn-premium {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.45);
            background: linear-gradient(135deg, #4f46e5, #9333ea);
        }

        .btn-premium:active {
            transform: translateY(0);
        }

        .alert-custom {
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            border: 1px solid transparent;
        }

        .alert-custom-danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .alert-custom-success {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.2);
            color: #a7f3d0;
        }

        .redirect-link {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .redirect-link:hover {
            color: #a78bfa;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Ambient glowing shapes -->
    <div class="glow-blob blob-1"></div>
    <div class="glow-blob blob-2"></div>

    <div class="login-container">
        <div class="glass-card">
            <a href="index.html" th:href="@{/}" class="text-decoration-none"><h1 class="brand-logo"><i class="fa-solid fa-soap me-2"></i>CleanTrack</h1></a>
            <p class="text-center text-muted mb-4">Laundry Management System Base</p>

            <!-- Alerts for Registration/Logout/Errors -->
            <div th:if="${error}" class="alert alert-custom alert-custom-danger">
                <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}">Error details</span>
            </div>
            
            <div th:if="${param.registered}" class="alert alert-custom alert-custom-success">
                <i class="fa-solid fa-circle-check me-2"></i>Registration successful! Please log in.
            </div>

            <div th:if="${param.logout}" class="alert alert-custom alert-custom-success">
                <i class="fa-solid fa-right-from-bracket me-2"></i>You have been logged out.
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <div class="input-group-custom">
                        <input type="text" name="username" class="form-control-custom" placeholder="Enter your username" required autofocus>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group-custom">
                        <input type="password" name="password" class="form-control-custom" placeholder="Enter your password" required>
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-premium mb-4">
                    <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In
                </button>

                <div class="text-center">
                    <span class="text-muted">New user? </span>
                    <a href="register.html" th:href="@{/register}" class="redirect-link">Register Account</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
