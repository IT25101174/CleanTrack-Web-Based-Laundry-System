<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Profile - CleanTrack</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        :root {
            --primary: #4e36f5;
            --primary-hover: #3d24e5;
            --secondary: #e6e4ff;
            --bg-color: #f8f9fe;
            --surface: #ffffff;
            --text-main: #1e1e2d;
            --text-muted: #8e8e9f;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .edit-container {
            background: var(--surface);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
        }

        .edit-container h2 {
            margin-top: 0;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--secondary);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="edit-container">
        <h2>Edit Profile Details</h2>
        <form th:action="@{/profile/edit}" method="post">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="fullName" th:value="${user.fullName}" required>
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" th:value="${user.email}" required>
            </div>
            
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" th:value="${user.phone}" required>
            </div>
            
            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" th:value="${user.address}" required>
            </div>
            
            <button type="submit" class="btn-primary">Save Changes</button>
        </form>
        <a th:href="@{${user.role.name() == 'CUSTOMER' ? '/customer-dashboard' : '/dashboard'}}" class="back-link">Cancel & Return</a>
    </div>
</body>
</html>
