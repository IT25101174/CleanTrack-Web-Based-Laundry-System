<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - Edit Profile</title>
    <th:block th:replace="~{fragments/layout :: head-links}"></th:block>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <aside th:replace="~{fragments/layout :: sidebar('')}"></aside>

    <main class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Edit Profile', 'Keep your contact details up to date.')}"></header>

        <div class="page-body narrow">
            <div class="page-card">
                <div class="text-center">
                    <div class="icon-circle"><i class="fa-solid fa-user-pen"></i></div>
                    <h3 class="mb-4">Edit Profile Details</h3>
                </div>

                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span>
                </div>

                <form th:action="@{/profile/edit}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                            <input type="text" class="form-control" name="fullName" th:value="${user.fullName}" maxlength="100" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" class="form-control" name="email" th:value="${user.email}" maxlength="100" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-phone"></i></span>
                            <input type="tel" class="form-control" name="phone" th:value="${user.phone}" maxlength="20" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Address (optional)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-location-dot"></i></span>
                            <input type="text" class="form-control" name="address" th:value="${user.address}" maxlength="255">
                        </div>
                    </div>

                    <div class="d-flex gap-3">
                        <a th:href="@{${user.role.name() == 'CUSTOMER' ? '/customer-dashboard' : '/dashboard'}}" class="btn btn-outline-custom w-100">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom w-100">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:replace="~{fragments/layout :: darkmode}"></script>
</body>
</html>
