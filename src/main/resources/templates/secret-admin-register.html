<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - Admin Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="auth-container wide">
        <div class="card-custom">
            <a href="index.html" th:href="@{/}" class="text-decoration-none"><h1 class="brand-logo"><i class="fa-solid fa-droplet"></i>CleanTrack</h1></a>
            <p class="auth-subtitle">First-time setup: create the system administrator account</p>

            <div th:if="${error}" class="alert-custom alert-custom-danger">
                <i class="fa-solid fa-circle-exclamation me-2"></i><span th:text="${error}">Error details</span>
            </div>

            <form th:action="@{/secret-admin-setup-99}" th:object="${user}" method="POST" autocomplete="off">
                <div class="row">
                    <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <div class="input-group-custom">
                                    <input type="text" th:field="*{fullName}" class="form-control-custom" placeholder="Enter full name" autocomplete="off" required autofocus>
                                    <i class="fa-solid fa-address-card"></i>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <div class="input-group-custom">
                                    <input type="text" th:field="*{username}" class="form-control-custom" placeholder="Choose a username" autocomplete="off" required>
                                    <i class="fa-solid fa-user"></i>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <div class="input-group-custom">
                                    <input type="email" th:field="*{email}" class="form-control-custom" placeholder="name@example.com" autocomplete="off" required>
                                    <i class="fa-solid fa-envelope"></i>
                                </div>
                            </div>
                    </div>
                    <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Phone Number</label>
                                <div class="input-group-custom">
                                    <input type="tel" th:field="*{phone}" class="form-control-custom" placeholder="Enter phone number" autocomplete="off" required>
                                    <i class="fa-solid fa-phone"></i>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group-custom">
                                    <input type="password" th:field="*{password}" class="form-control-custom" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">
                                    <i class="fa-solid fa-lock"></i>
                                </div>
                            </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address (optional)</label>
                    <div class="input-group-custom">
                        <input type="text" th:field="*{address}" class="form-control-custom" placeholder="Enter address" autocomplete="off">
                        <i class="fa-solid fa-location-dot"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary-custom mb-3">
                    <i class="fa-solid fa-user-plus me-2"></i>Create Administrator
                </button>
            </form>

            <p class="auth-footer mb-0">Already registered? <a href="login.html" th:href="@{/login}" class="redirect-link">Sign In</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
