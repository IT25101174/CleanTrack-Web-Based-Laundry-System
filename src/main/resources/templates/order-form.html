<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - Order Form</title>
    <th:block th:replace="~{fragments/layout :: head-links}"></th:block>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <aside th:replace="~{fragments/layout :: sidebar('orders')}"></aside>

    <main class="main-content">
        <th:block th:if="${order.id == null}">
            <header th:replace="~{fragments/layout :: topbar('Place New Order', 'Provide the details of your laundry request.')}"></header>
        </th:block>
        <th:block th:if="${order.id != null}">
            <header th:replace="~{fragments/layout :: topbar('Edit Order', 'Change the items or the service of your laundry request.')}"></header>
        </th:block>

        <div class="page-body narrow">
            <div class="page-card">
                <div class="text-center">
                    <div class="icon-circle">
                        <i class="fa-solid fa-basket-shopping"></i>
                    </div>
                    <h3 class="mb-1" th:text="${order.id != null ? 'Edit Order' : 'New Laundry Order'}">New Laundry Order</h3>
                    <p class="text-muted mb-4" th:text="${order.id != null ? 'Change the items or the service. The invoice is updated automatically.' : 'Provide the details and complete your payment.'}">Provide the details and complete your payment.</p>
                </div>

                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span>
                </div>

                <form th:action="${order.id != null ? '/orders/' + order.id + '/edit' : '/orders/new'}" method="POST" th:object="${order}" enctype="multipart/form-data">

                    <div class="mb-3">
                        <label class="form-label">Item Description (e.g., 5 Shirts, 2 Trousers)</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-align-left"></i></span>
                            <input type="text" class="form-control" th:field="*{itemDescription}" maxlength="255" required placeholder="Describe the items">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Total Quantity</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-hashtag"></i></span>
                            <input type="number" class="form-control" id="quantity" th:field="*{quantity}" min="1" required placeholder="Total number of items" oninput="calculateTotal()">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Service Type</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-shirt"></i></span>
                            <select th:field="*{serviceType}" id="serviceType" class="form-select" required onchange="calculateTotal()">
                                <option value="" disabled th:selected="*{serviceType == null}">-- Select a service --</option>
                                <option value="WASH_ONLY">Wash Only (Standard) - Rs. 500/item</option>
                                <option value="WASH_IRON">Wash &amp; Iron (Premium) - Rs. 800/item</option>
                                <option value="DRY_CLEAN">Dry Cleaning (Delicate) - Rs. 1200/item</option>
                            </select>
                        </div>
                    </div>

                    <div class="price-box" id="priceBox" style="display: none;">
                        <div class="text-muted small mb-1">Subtotal: Rs. <span id="subtotalDisplay">0.00</span> | Tax (10%): Rs. <span id="taxDisplay">0.00</span></div>
                        <div class="fs-4 fw-bold text-success">Total Payable: Rs. <span id="totalDisplay">0.00</span></div>
                    </div>

                    <!-- Payment is taken only when a new order is placed -->
                    <th:block th:if="${order.id == null}">
                        <hr class="my-4">

                        <h5 class="mb-3">Payment</h5>

                        <div class="mb-3">
                            <label class="form-label">Payment Method</label>
                            <select name="paymentMethod" id="paymentMethod" class="form-select" required onchange="togglePaymentFields()">
                                <option value="" selected disabled>-- Select Payment Method --</option>
                                <option value="BANK_TRANSFER">Bank Transfer (Upload Receipt)</option>
                            </select>
                        </div>

                        <div id="bankTransferFields" class="p-3 mb-4 rounded" style="display: none; background: rgba(67, 24, 255, 0.04);">
                            <div class="mb-2 text-muted small">
                                Please transfer the total amount to: <br>
                                <strong>CleanTrack Bank PLC</strong><br>
                                A/C: 1029384756 (Branch: Colombo)
                            </div>
                            <div class="mb-1 mt-3">
                                <label class="form-label">Upload Bank Receipt (PDF or image)</label>
                                <input type="file" name="bankReceipt" id="bankReceipt" class="form-control" accept=".pdf,image/*">
                            </div>
                        </div>
                    </th:block>

                    <div class="d-flex gap-3 mt-4">
                        <a th:href="@{/orders}" class="btn btn-outline-custom w-100">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom w-100" th:text="${order.id != null ? 'Update Order' : 'Submit & Pay'}">Submit &amp; Pay</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:replace="~{fragments/layout :: darkmode}"></script>

    <script>
        function calculateTotal() {
            const qty = parseInt(document.getElementById('quantity').value) || 0;
            const service = document.getElementById('serviceType').value;

            if (qty > 0 && service) {
                let base = 500;
                if (service === 'WASH_IRON') base = 800;
                if (service === 'DRY_CLEAN') base = 1200;

                const subtotal = base * qty;
                const tax = subtotal * 0.10;
                const total = subtotal + tax;

                document.getElementById('subtotalDisplay').textContent = subtotal.toFixed(2);
                document.getElementById('taxDisplay').textContent = tax.toFixed(2);
                document.getElementById('totalDisplay').textContent = total.toFixed(2);

                document.getElementById('priceBox').style.display = 'block';
            } else {
                document.getElementById('priceBox').style.display = 'none';
            }
        }

        function togglePaymentFields() {
            const methodBox = document.getElementById('paymentMethod');
            const bankFields = document.getElementById('bankTransferFields');
            const fileInput = document.getElementById('bankReceipt');
            if (!methodBox || !bankFields || !fileInput) { return; }

            if (methodBox.value === 'BANK_TRANSFER') {
                bankFields.style.display = 'block';
                fileInput.required = true;
            } else {
                bankFields.style.display = 'none';
                fileInput.required = false;
            }
        }

        // Show the price straight away when an existing order is being edited
        calculateTotal();
    </script>
</body>
</html>
