<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CleanTrack layout fragments</title>
</head>
<body>

    <!-- Common <head> links: th:replace="~{fragments/layout :: head-links}" -->
    <th:block th:fragment="head-links">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </th:block>

    <!-- Sidebar used by the pages inside the dashboard layout.
         Usage: th:replace="~{fragments/layout :: sidebar('orders')}"
         The page name highlights the matching menu item. -->
    <aside class="sidebar" th:fragment="sidebar(active)">
        <div class="logo">
            <i class="fa-solid fa-droplet"></i>
            CleanTrack
        </div>

        <ul class="nav-links">
            <a th:href="@{/dashboard}" style="text-decoration: none;">
                <li class="nav-item" th:classappend="${active == 'dashboard'} ? 'active'">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </li>
            </a>
            <a th:href="@{/orders}" style="text-decoration: none;">
                <li class="nav-item" th:classappend="${active == 'orders'} ? 'active'">
                    <i class="fa-solid fa-shirt"></i>
                    Orders
                </li>
            </a>
            <a th:href="@{/invoices}" style="text-decoration: none;">
                <li class="nav-item" th:classappend="${active == 'invoices'} ? 'active'">
                    <i class="fa-solid fa-file-invoice"></i>
                    Invoices
                </li>
            </a>
            <a th:href="@{/queue}" style="text-decoration: none;" th:if="${user.role?.name() != 'CUSTOMER'}">
                <li class="nav-item" th:classappend="${active == 'queue'} ? 'active'">
                    <i class="fa-solid fa-list-check"></i>
                    Queue
                </li>
            </a>
            <a th:href="@{/status-history}" style="text-decoration: none;" th:if="${user.role?.name() != 'CUSTOMER'}">
                <li class="nav-item" th:classappend="${active == 'history'} ? 'active'">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    History
                </li>
            </a>
            <a th:href="@{/inventory}" style="text-decoration: none;" th:if="${user.role?.name() == 'COUNTER_STAFF' || user.role?.name() == 'BRANCH_SUPERVISOR' || user.role?.name() == 'ADMIN'}">
                <li class="nav-item" th:classappend="${active == 'inventory'} ? 'active'">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    Inventory
                </li>
            </a>
            <a th:href="@{/complaints}" style="text-decoration: none;">
                <li class="nav-item" th:classappend="${active == 'complaints'} ? 'active'">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    Complaints
                </li>
            </a>
            <a th:href="@{/reports}" style="text-decoration: none;" th:if="${user.role?.name() == 'BRANCH_SUPERVISOR' || user.role?.name() == 'ADMIN'}">
                <li class="nav-item" th:classappend="${active == 'reports'} ? 'active'">
                    <i class="fa-solid fa-chart-line"></i>
                    Reports
                </li>
            </a>
            <a th:href="@{/admin/users}" style="text-decoration: none;" th:if="${user.role?.name() == 'ADMIN'}">
                <li class="nav-item" th:classappend="${active == 'users'} ? 'active'">
                    <i class="fa-solid fa-users"></i>
                    Users
                </li>
            </a>
            <a href="#" onclick="toggleDarkMode(); return false;" style="text-decoration: none;">
                <li class="nav-item">
                    <i class="fa-solid fa-moon"></i>
                    Dark Mode
                </li>
            </a>
        </ul>
    </aside>

    <!-- Page header with the signed-in user.
         Usage: th:replace="~{fragments/layout :: topbar('Title', 'Subtitle')}" -->
    <header class="header" th:fragment="topbar(title, subtitle)">
        <div class="welcome-text">
            <h1 th:text="${title}">Title</h1>
            <p th:text="${subtitle}">Subtitle</p>
        </div>
        <div class="user-profile">
            <a th:href="@{/profile/edit}" style="text-decoration:none; margin-right: 15px;" title="Edit Details"><i class="fa-solid fa-user-pen" style="font-size: 20px; color: var(--text-muted); cursor: pointer;"></i></a>
            <a th:href="@{/logout}" style="text-decoration:none;" title="Sign Out"><i class="fa-solid fa-right-from-bracket" style="font-size: 20px; color: var(--text-muted); cursor: pointer;"></i></a>
            <div class="avatar" th:text="${user.fullName.substring(0,1).toUpperCase()}">A</div>
            <div style="font-weight: 600;" th:text="${user.fullName}">User Name</div>
        </div>
    </header>

    <!-- Dark mode switch shared by all pages -->
    <script th:fragment="darkmode">
        function toggleDarkMode() {
            document.body.classList.toggle('dark-theme');
            try { localStorage.setItem('darkMode', document.body.classList.contains('dark-theme')); } catch (e) {}
        }
        try {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark-theme');
            }
        } catch (e) {}
    </script>

</body>
</html>
