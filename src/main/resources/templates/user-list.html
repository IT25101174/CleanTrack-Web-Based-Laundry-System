<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTrack - User Accounts</title>
    <th:block th:replace="~{fragments/layout :: head-links}"></th:block>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>

    <main class="main-content">
        <header th:replace="~{fragments/layout :: topbar('User Accounts', 'View and manage every registered account.')}"></header>

        <div class="page-body">
            <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-circle-check me-2"></i><span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fa-solid fa-triangle-exclamation me-2"></i><span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="page-card">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div>
                        <h4 class="mb-1">All accounts</h4>
                        <span class="text-muted small">
                            Showing <strong th:text="${users.size()}">0</strong> of <strong th:text="${totalUsers}">0</strong> accounts
                        </span>
                    </div>
                    <a th:href="@{/admin/users/new}" class="btn btn-primary-custom rounded-pill px-4">
                        <i class="fa-solid fa-user-plus me-2"></i>Add Employee
                    </a>
                </div>

                <form th:action="@{/admin/users}" method="get" class="row g-2 mb-4">
                    <div class="col-12 col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                            <input type="text" class="form-control" name="q" th:value="${q}" placeholder="Search by name, username, email or phone">
                        </div>
                    </div>
                    <div class="col-8 col-md-4">
                        <select class="form-select" name="role" aria-label="Filter by role">
                            <option value="">All roles</option>
                            <option th:each="r : ${roles}" th:value="${r.name()}"
                                    th:selected="${r.name() == roleFilter}"
                                    th:text="${#strings.capitalizeWords(#strings.toLowerCase(r.name()).replace('_', ' '))}">Role</option>
                        </select>
                    </div>
                    <div class="col-4 col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary-custom flex-fill">Filter</button>
                        <a th:href="@{/admin/users}" class="btn btn-outline-custom" title="Clear filters"><i class="fa-solid fa-xmark"></i></a>
                    </div>
                </form>

                <div class="table-responsive">
                    <table class="table table-custom user-table align-middle">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Role</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="avatar" th:text="${u.fullName != null and !u.fullName.isEmpty()} ? ${u.fullName.substring(0,1).toUpperCase()} : '?'">A</div>
                                        <div>
                                            <div class="fw-semibold text-nowrap" th:text="${u.fullName}">Full Name</div>
                                            <span class="badge bg-secondary" th:if="${u.id == user.id}">You</span>
                                        </div>
                                    </div>
                                </td>
                                <td class="text-nowrap" th:text="${u.username}">username</td>
                                <td class="text-nowrap" th:text="${u.email}">email</td>
                                <td class="text-nowrap" th:text="${u.phone}">phone</td>
                                <td>
                                    <span class="role-badge" th:attr="data-role=${u.role}"
                                          th:text="${u.role != null} ? ${#strings.capitalizeWords(#strings.toLowerCase(u.role.name()).replace('_', ' '))} : '-'">Role</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-outline-custom px-3 py-2 text-nowrap">
                                        <i class="fa-solid fa-pen me-1"></i>Edit
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${users.isEmpty()}">
                                <td colspan="6" class="text-center text-muted py-5">
                                    <i class="fa-solid fa-user-slash fa-2x mb-2 d-block"></i>
                                    No accounts match your search.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:replace="~{fragments/layout :: darkmode}"></script>
</body>
</html>
