spring.application.name=laundry-system

# Web Server Configuration
server.port=8080

# Local H2 File-Based Database Configuration (Zero Install, but PERMANENT data)
spring.datasource.url=jdbc:h2:file:./data/laundry_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Hibernate settings (auto-creates tables from the models)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

