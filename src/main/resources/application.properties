spring.application.name=laundry-system

# Web Server Configuration
server.port=8080

# Local MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/laundry_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate settings (auto-creates tables from the models)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true